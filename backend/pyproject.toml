[project]
name = "daily-checkin-backend"
version = "0.1.0"
description = "Voice-driven daily standup bot API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.1",
    "anthropic>=0.76.0",
    "apscheduler>=3.11.2",
    "asyncpg>=0.31.0",
    "cryptography>=44.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.128.0",
    "greenlet>=3.3.1",
    "httpx>=0.28.1",
    "livekit-agents[silero,turn-detector]~=1.3",
    "numpy>=1.26.0",
    "psycopg2-binary>=2.9.11",
    "pycronometer @ git+https://github.com/PreritO/pycronometer.git",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "scipy>=1.11.0",
    "sqlalchemy>=2.0.46",
    "structlog>=25.5.0",
    "twilio>=9.0.0",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.19.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # B008: Allow Depends() in argument defaults (FastAPI pattern)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.isort]
known-first-party = ["src"]
